name: Setup Node
description: Setup pnpm and Node.js, then install dependencies

runs:
  using: "composite"
  steps:
    # pnpm 版本取 package.json 的 packageManager，Node 版本自动读 .node-version，
    # 随后自动 pnpm install；cache 缓存 pnpm store（lockfile 校验结果总会缓存）。
    - name: Setup pnpm, Node.js and dependencies
      uses: pnpm/setup@v3
      with:
        cache: true
