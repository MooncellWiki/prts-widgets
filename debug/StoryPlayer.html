<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryPlayer 独立调试</title>
    <!-- 仅本地 dev 使用的调试页，不在 templates/ 里，不进 build 产物 -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      /* 调试页自有样式不走 uno：纯 TS 入口文件的 class 不被 UnoCSS 提取
         （页面里生效的 uno class 都是恰好在其他 widget 文件里出现过的），
         全部手写 spd- 前缀，保证确定性渲染。 */
      .spd-root {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        padding: 16px;
      }
      .spd-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .spd-url {
        color: #9ca3af;
        font-size: 12px;
        word-break: break-all;
      }
      .spd-main {
        flex: 1;
        min-height: 0;
      }
      .spd-player-pane {
        height: 100%;
        min-width: 0;
        overflow-y: auto;
        padding-right: 4px;
      }
      .spd-script-pane {
        box-sizing: border-box;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
        min-width: 0;
        padding: 8px;
      }
      .spd-script-header {
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        padding: 0 4px;
      }
      .spd-legend {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .spd-legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .spd-swatch {
        background: rgba(14, 165, 233, 0.2);
        border: 1px solid rgba(2, 132, 199, 0.5);
        border-radius: 2px;
        display: inline-block;
        height: 10px;
        width: 20px;
      }
      .spd-script-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .spd-line {
        border-radius: 4px;
        display: flex;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        gap: 8px;
        line-height: 20px;
        padding: 1px 4px;
      }
      .spd-line-no {
        color: #9ca3af;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        text-align: right;
        user-select: none;
        width: 44px;
      }
      .spd-line-content {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .spd-line-text {
        color: #374151;
        cursor: pointer;
      }
      .spd-line-text:hover {
        background-color: #f3f4f6;
      }
      .spd-line-cmd {
        color: #9ca3af;
      }
      .spd-line-current {
        background-color: rgba(14, 165, 233, 0.2);
        font-weight: 700;
      }
      .spd-line-current .spd-line-content {
        color: #0c4a6e;
      }
      .spd-line-current .spd-line-no {
        color: #0369a1;
      }
      .spd-mark {
        color: rgba(245, 158, 11, 0.6);
        flex-shrink: 0;
      }
      .spd-mark-planned {
        color: #d97706;
        font-weight: 700;
      }
      .spd-placeholder {
        color: #9ca3af;
        font-size: 12px;
        padding: 8px;
      }
      .spd-alert-detail {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/StoryPlayerDebug.ts"></script>
  </body>
</html>
